name: Sync upstream and build Aerial

on:
  # 本仓库有人提交代码时构建；Actions 自己产生的提交由 job 条件排除。
  push:
    branches:
      - "**"
    # 文档和工作流自身的调整不需要重新打 APK。
    paths-ignore:
      - "README"
      - "README.*"
      - "docs/**"
      - ".github/workflows/**"
  # 定时任务只检查上游是否发布了新 Release，不跟踪上游普通代码提交。
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aerial-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check whether upstream has a new Release
        id: upstream_release
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$(curl -fsSL https://api.github.com/repos/pengchujin/aerial-tv/releases/latest | jq -r '.tag_name // empty')"
          test -n "$release_tag" || { echo "Could not determine the latest upstream Release."; exit 1; }
          previous_tag="$(cat .github/upstream-release.txt 2>/dev/null || true)"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ "$release_tag" == "$previous_tag" ]]; then
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream Release ($release_tag); skip sync, build and publish."
          else
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "New upstream Release detected: $previous_tag -> $release_tag"
          fi

      - name: Sync the newly released upstream source
        id: sync_upstream
        if: ${{ steps.upstream_release.outputs.new_release == 'true' }}
        shell: bash
        env:
          UPSTREAM_RELEASE_TAG: ${{ steps.upstream_release.outputs.tag }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pengchujin/aerial-tv.git
          git fetch --depth=1 upstream "refs/tags/$UPSTREAM_RELEASE_TAG:refs/tags/$UPSTREAM_RELEASE_TAG"
          mkdir -p /tmp/aerial-upstream
          git archive "$UPSTREAM_RELEASE_TAG" | tar -x -C /tmp/aerial-upstream

          # These are fork-owned files; upstream releases must never overwrite them.
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/README*' \
            --exclude='/mod/' \
            --exclude='/version.txt' \
            --exclude='/.github/workflows/' \
            --exclude='/.github/upstream-release.txt' \
            /tmp/aerial-upstream/ ./

          mkdir -p .github
          printf '%s\n' "$UPSTREAM_RELEASE_TAG" > .github/upstream-release.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync upstream Release $UPSTREAM_RELEASE_TAG"
          git push origin HEAD:main

      - name: Decide whether a build is needed
        id: build_gate
        shell: bash
        run: |
          set -euo pipefail
          should_build=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_ACTOR" != "github-actions[bot]" ]]; then
            should_build=true
            echo "Fork commit detected; build this commit."
          elif [[ "${{ steps.upstream_release.outputs.new_release }}" == "true" ]]; then
            should_build=true
            echo "New upstream Release detected; build the synchronized release."
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            should_build=true
            echo "Manual build requested on main; build the current fork commit."
          else
            echo "No qualifying fork commit or new upstream Release; skip build and publish."
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Set fork release version
        if: ${{ github.ref == 'refs/heads/main' && steps.build_gate.outputs.should_build == 'true' }}
        id: fork_version
        shell: bash
        run: |
          set -euo pipefail
          # Read the literal upstream version before mod/apply.py rewrites it.
          base_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [[ -z "$base_version" ]]; then
            echo "Could not determine upstream versionName from app/build.gradle.kts"
            exit 1
          fi
          version="${base_version}.${GITHUB_RUN_NUMBER}"
          code=$((100000 + GITHUB_RUN_NUMBER))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building fork release $version (versionCode $code)"


      - name: Apply protected mod injection
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        run: |
           python3 -m py_compile mod/apply.py
           python3 mod/apply.py

      - name: Verify patch and whitespace
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        run: |
          set -euo pipefail
          git diff --check
          grep -q '移出不补位' app/src/main/res/values-zh/strings.xml
          grep -q 'emptySlot' app/src/main/java/app/orchard/tv/apps/Apps.kt
          grep -q 'hidden_slots' app/src/main/java/app/orchard/tv/settings/AerialSettings.kt

      - name: Set up JDK 17
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set"; exit 1; }

          # GitHub-hosted runners install sdkmanager under cmdline-tools,
          # but do not necessarily add it to PATH.
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed APK signing key
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.AERIAL_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.AERIAL_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.AERIAL_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.AERIAL_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing GitHub Secret: AERIAL_SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "Missing GitHub Secret: AERIAL_SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "Missing GitHub Secret: AERIAL_SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "Missing GitHub Secret: AERIAL_SIGNING_KEY_PASSWORD"; exit 1; }

          mkdir -p local
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > local/signing.keystore
          test -s local/signing.keystore
          cat > local/signing.properties <<EOF
          storeFile=signing.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

          echo "Fixed signing key restored successfully."

      - name: Build Standard and Guard APKs
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        run: |
          ./gradlew --no-daemon \
            -PaerialVersionName="${{ steps.fork_version.outputs.name || '1.85' }}" \
            -PaerialVersionCode="${{ steps.fork_version.outputs.code || '116' }}" \
            assembleStandardRelease assembleGuardRelease

      - name: Verify APK signatures
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.AERIAL_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.AERIAL_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER" || { echo "apksigner not found: $APKSIGNER"; exit 1; }

          expected="$(keytool -list -v -keystore local/signing.keystore -alias "$SIGNING_KEY_ALIAS" -storepass "$SIGNING_STORE_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test -n "$expected" || { echo "Could not read signing certificate fingerprint."; exit 1; }

          # Keep the fork's signing identity stable across releases. Changing this value
          # requires an intentional migration plan for already-installed TV builds.
          pinned="c84d01e082e34562864dc18a7c553ad2fe18e10b5706f1ba470b5926338132ee"
          if [[ "$expected" != "$pinned" ]]; then
            echo "Signing keystore changed; refusing to publish an incompatible update."
            echo "Expected pinned certificate: $pinned"
            echo "Actual keystore certificate: $expected"
            exit 1
          fi
          echo "Pinned signing certificate: $expected"

          for apk in "app/build/outputs/apk/standard/release/app-standard-release.apk" "app/build/outputs/apk/guard/release/app-guard-release.apk"; do
            test -s "$apk" || { echo "APK not found: $apk"; exit 1; }
            actual="$("$APKSIGNER" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"
            test -n "$actual" || { echo "No signer certificate found in $apk"; exit 1; }
            test "$actual" = "$expected" || {
              echo "Signing certificate mismatch: $apk"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            }
            echo "Verified fixed signature: $apk"
          done

      - name: Upload APK artifacts
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aerial-tv-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/guard/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APKs for fork release
        if: ${{ github.ref == 'refs/heads/main' && steps.build_gate.outputs.should_build == 'true' }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/standard/release/app-standard-release.apk aerial-standard.apk
          cp app/build/outputs/apk/guard/release/app-guard-release.apk aerial-guard.apk

      - name: Publish fork release
        if: ${{ github.ref == 'refs/heads/main' && steps.build_gate.outputs.should_build == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.fork_version.outputs.name }}
          target_commitish: main
          name: Aerial ${{ steps.fork_version.outputs.name }} · klcb2010
          body: |
            klcb2010/aerial-tv 魔改版正式构建。

            基于 pengchujin/aerial-tv，上游同步与本仓库 mod/ 定制补丁均已应用。
          files: |
            aerial-standard.apk
            aerial-guard.apk
          overwrite_files: true
          make_latest: true

      - name: Publish in-app update version
        if: ${{ github.ref == 'refs/heads/main' && steps.build_gate.outputs.should_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.fork_version.outputs.name }}" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish in-app update version ${{ steps.fork_version.outputs.name }}"
            git push origin HEAD:main
          fi
