name: Sync upstream and build Aerial

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aerial-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Sync upstream source (protected local files are retained)
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/pengchujin/aerial-tv.git
          git fetch --depth=1 upstream main
          mkdir -p /tmp/aerial-upstream
          git archive upstream/main | tar -x -C /tmp/aerial-upstream

          # These are the only local-owned areas. Never let upstream overwrite them.
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/README*' \
            --exclude='/mod/' \
            --exclude='/.github/workflows/' \
            /tmp/aerial-upstream/ ./

          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync upstream pengchujin/aerial-tv"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Upstream source is already synchronized."
          fi

      - name: Apply protected mod injection
        run: python3 mod/apply.py

      - name: Verify patch and whitespace
        run: |
          set -euo pipefail
          git diff --check
          grep -q '隐藏不补位' app/src/main/res/values-zh/strings.xml
          grep -q 'emptySlot' app/src/main/java/app/orchard/tv/apps/Apps.kt
          grep -q 'hidden_slots' app/src/main/java/app/orchard/tv/settings/AerialSettings.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set"; exit 1; }

          # GitHub-hosted runners install sdkmanager under cmdline-tools,
          # but do not necessarily add it to PATH.
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Standard and Guard APKs
        run: ./gradlew --no-daemon assembleStandardRelease assembleGuardRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aerial-tv-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/guard/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check for a new upstream release
        id: upstream_release
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Parse with Python's standard JSON library instead of relying on jq.
          release="$(gh api repos/pengchujin/aerial-tv/releases/latest)"
          mapfile -t release_fields < <(python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          print(r.get("tag_name") or "")
          print(r.get("name") or r.get("tag_name") or "")
          print(r.get("body") or "")
          ' <<<"$release")
          upstream_tag="\${release_fields[0]:-}"
          release_name="\${release_fields[1]:-}"
          release_body="\${release_fields[2]:-}"
          test -n "$upstream_tag" || { echo "Upstream release has no tag_name"; exit 1; }
          tag="upstream-${upstream_tag}"
          # Check the GitHub Release itself, not merely whether a Git tag exists.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "name=${release_name}" >> "$GITHUB_OUTPUT"
            {
              echo "body<<AERIAL_RELEASE_BODY"
              echo "同步自上游 pengchujin/aerial-tv ${upstream_tag}。"
              echo
              echo "$release_body"
              echo
              echo "本构建额外注入了 mod/ 中的「隐藏不补位」功能。"
              echo "AERIAL_RELEASE_BODY"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare APKs for in-app updates
        if: \${{ steps.upstream_release.outputs.publish == 'true' }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/standard/release/app-standard-release.apk aerial-standard.apk
          cp app/build/outputs/apk/guard/release/app-guard-release.apk aerial-guard.apk

      - name: Publish APKs for a new upstream release
        if: ${{ steps.upstream_release.outputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream_release.outputs.tag }}
          target_commitish: main
          name: Aerial ${{ steps.upstream_release.outputs.name }} · klcb2010
          body: ${{ steps.upstream_release.outputs.body }}
          files: |
            aerial-standard.apk
            aerial-guard.apk
          make_latest: true
