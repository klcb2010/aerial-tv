name: Sync upstream and build Aerial

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aerial-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !(github.event_name == 'push' && github.actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Sync upstream source (protected local files are retained)
        id: sync_upstream
        if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git remote add upstream https://github.com/pengchujin/aerial-tv.git
          git fetch --depth=1 upstream main
          mkdir -p /tmp/aerial-upstream
          git archive upstream/main | tar -x -C /tmp/aerial-upstream

          # These are the only local-owned areas. Never let upstream overwrite them.
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/README*' \
            --exclude='/mod/' \
            --exclude='/version.txt' \
            --exclude='/.github/workflows/' \
            /tmp/aerial-upstream/ ./

          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync upstream pengchujin/aerial-tv"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream source is already synchronized."
          fi

      - name: Decide whether a build is needed
        id: build_gate
        shell: bash
        run: |
          set -euo pipefail
          should_build=true
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" && "${{ steps.sync_upstream.outputs.changed }}" != "true" ]]; then
            should_build=false
            echo "No upstream changes detected; skip build and release."
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Apply protected mod injection
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        run: python3 mod/apply.py

      - name: Verify patch and whitespace
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        run: |
          set -euo pipefail
          git diff --check
          grep -q '移出不补位' app/src/main/res/values-zh/strings.xml
          grep -q 'emptySlot' app/src/main/java/app/orchard/tv/apps/Apps.kt
          grep -q 'hidden_slots' app/src/main/java/app/orchard/tv/settings/AerialSettings.kt

      - name: Set up JDK 17
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not set"; exit 1; }

          # GitHub-hosted runners install sdkmanager under cmdline-tools,
          # but do not necessarily add it to PATH.
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" || { echo "sdkmanager not found under $ANDROID_HOME"; exit 1; }

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Set fork release version
        if: ${{ github.ref == 'refs/heads/main' && steps.build_gate.outputs.should_build == 'true' }}
        id: fork_version
        shell: bash
        run: |
          set -euo pipefail
          version="1.85.${GITHUB_RUN_NUMBER}"
          code=$((100000 + GITHUB_RUN_NUMBER))
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building fork release $version (versionCode $code)"

      - name: Restore fixed APK signing key
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.AERIAL_SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.AERIAL_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.AERIAL_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.AERIAL_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo "Missing GitHub Secret: AERIAL_SIGNING_KEYSTORE_BASE64"; exit 1; }
          test -n "$SIGNING_STORE_PASSWORD" || { echo "Missing GitHub Secret: AERIAL_SIGNING_STORE_PASSWORD"; exit 1; }
          test -n "$SIGNING_KEY_ALIAS" || { echo "Missing GitHub Secret: AERIAL_SIGNING_KEY_ALIAS"; exit 1; }
          test -n "$SIGNING_KEY_PASSWORD" || { echo "Missing GitHub Secret: AERIAL_SIGNING_KEY_PASSWORD"; exit 1; }

          mkdir -p local
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > local/signing.keystore
          test -s local/signing.keystore
          cat > local/signing.properties <<EOF
          storeFile=signing.keystore
          storePassword=$SIGNING_STORE_PASSWORD
          keyAlias=$SIGNING_KEY_ALIAS
          keyPassword=$SIGNING_KEY_PASSWORD
          EOF

          echo "Fixed signing key restored successfully."

      - name: Build Standard and Guard APKs
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        run: |
          ./gradlew --no-daemon \
            -PaerialVersionName="${{ steps.fork_version.outputs.name || '1.85' }}" \
            -PaerialVersionCode="${{ steps.fork_version.outputs.code || '116' }}" \
            assembleStandardRelease assembleGuardRelease

      - name: Verify APK signatures
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.AERIAL_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.AERIAL_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER" || { echo "apksigner not found: $APKSIGNER"; exit 1; }

          expected="$(keytool -list -v -keystore local/signing.keystore -alias "$SIGNING_KEY_ALIAS" -storepass "$SIGNING_STORE_PASSWORD" 2>/dev/null | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          test -n "$expected" || { echo "Could not read signing certificate fingerprint."; exit 1; }

          for apk in "app/build/outputs/apk/standard/release/app-standard-release.apk" "app/build/outputs/apk/guard/release/app-guard-release.apk"; do
            test -s "$apk" || { echo "APK not found: $apk"; exit 1; }
            actual="$("$APKSIGNER" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"
            test -n "$actual" || { echo "No signer certificate found in $apk"; exit 1; }
            test "$actual" = "$expected" || {
              echo "Signing certificate mismatch: $apk"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            }
            echo "Verified fixed signature: $apk"
          done

      - name: Upload APK artifacts
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: aerial-tv-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/guard/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APKs for fork release
        if: ${{ github.ref == 'refs/heads/main' && steps.build_gate.outputs.should_build == 'true' }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/standard/release/app-standard-release.apk aerial-standard.apk
          cp app/build/outputs/apk/guard/release/app-guard-release.apk aerial-guard.apk

      - name: Publish fork release
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.fork_version.outputs.name }}
          target_commitish: main
          name: Aerial ${{ steps.fork_version.outputs.name }} · klcb2010
          body: |
            klcb2010/aerial-tv 魔改版正式构建。

            基于 pengchujin/aerial-tv，上游同步与本仓库 mod/ 定制补丁均已应用。
          files: |
            aerial-standard.apk
            aerial-guard.apk
          overwrite_files: true
          make_latest: true

      - name: Publish in-app update version
        if: ${{ steps.build_gate.outputs.should_build == 'true' }}
        if: ${{ github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.fork_version.outputs.name }}" > version.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish in-app update version ${{ steps.fork_version.outputs.name }}"
            git push origin HEAD:main
          fi
